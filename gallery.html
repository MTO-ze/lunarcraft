<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Lunera Crafts</title>
    <style>
        body { background: #120d0a; color: white; padding: 20px; font-family: sans-serif; }
        .back-btn { display: inline-block; padding: 10px 20px; background: #d4af37; color: black; text-decoration: none; border-radius: 5px; font-weight: bold; margin-bottom: 20px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid #d4af37; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back Home</a>
    <h1>Our Gallery</h1>
    
    <div class="gallery-grid">
        <!-- നിങ്ങളുടെ ഫോട്ടോസ് താഴെ പറയുന്ന രീതിയിൽ ചേർക്കുക -->
        <div class="gallery-item"><img src="images/photo1.jpg" alt="Gift 1"></div>
        <div class="gallery-item"><img src="images/photo2.jpg" alt="Gift 2"></div>
        <!-- കൂടുതൽ ഫോട്ടോസ് വേണമെങ്കിൽ ഈ ലൈൻ കോപ്പി ചെയ്ത് മാറ്റുക -->
    </div>
</body>
</html>
