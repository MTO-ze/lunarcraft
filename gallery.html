<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Lunera Crafts</title>
    <style>
        body { background: #120d0a; color: white; padding: 20px; font-family: sans-serif; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .gallery-item img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; border: 2px solid #d4af37; }
        .back-btn { display: inline-block; padding: 10px 20px; background: #d4af37; color: black; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back Home</a>
    <h1>Our Creations</h1>
    <div class="gallery-grid">
        <!-- നിങ്ങളുടെ ഫോട്ടോകൾ ഇവിടെ ചേർക്കുക -->
        <div class="gallery-item"><img src="images/gift1.jpg" alt="Gift 1"></div>
        <div class="gallery-item"><img src="images/gift2.jpg" alt="Gift 2"></div>
    </div>
</body>
</html>
