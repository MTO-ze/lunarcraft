<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Lunera Crafts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #120d0a;
            color: white;
            padding: 30px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Back Button Animation */
        .back-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #d4af37;
            color: black;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .back-btn:hover {
            transform: translateX(-5px);
            background: #f3ce5a;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        /* Title Gradient */
        h1 {
            margin-bottom: 25px;
            font-size: 2.2rem;
            background: linear-gradient(45deg, #ffffff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 1s ease forwards;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Animated Image Card */
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), filter 0.5s ease;
        }

        /* Hover Zoom Effect */
        .gallery-item:hover img {
            transform: scale(1.12);
            filter: brightness(1.1);
        }

        .gallery-item:hover {
            border-color: #d4af37;
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.4);
        }

        /* Keyframe Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back Home</a>
    <h1>Our Gallery</h1>
    
    <div class="gallery-grid">
        <div class="gallery-item"><img src="IMG-20260808-WA0017.jpg" alt="Gift Item"></div>
        <div class="gallery-item"><img src="IMG-20260808-WA0018.jpg" alt="Gift Item"></div>
        <div class="gallery-item"><img src="IMG-20260808-WA0019.jpg" alt="Gift Item"></div>
        <div class="gallery-item"><img src="IMG-20260808-WA0020.jpg" alt="Gift Item"></div>
        <div class="gallery-item"><img src="IMG-20260808-WA0021.jpg" alt="Gift Item"></div>
        <div class="gallery-item"><img src="IMG-20260808-WA0022.jpg" alt="Gift Item"></div>
    </div>

</body>
</html>
