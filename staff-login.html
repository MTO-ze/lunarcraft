<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal | Lunera Crafts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --accent-gold: #d4af37;
            --glass-bg: rgba(20, 14, 10, 0.9);
            --glass-border: rgba(212, 175, 55, 0.3);
            --text-light: #f5ebe6;
        }

        body {
            background: #070503;
            color: var(--text-light);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center;
        }

        .login-card h2 {
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .login-card p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            border: none;
            border-radius: 50px;
            color: #000;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .login-btn:hover {
            transform: scale(1.02);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }

        /* DASHBOARD SECTION (Hidden by default) */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 600px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 20px;
        }

        .dashboard h3 {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <!-- LOGIN FORM -->
    <div class="login-card" id="loginBox">
        <i class="fa-solid fa-user-shield" style="font-size: 2.5rem; color: var(--accent-gold); margin-bottom: 15px;"></i>
        <h2>Staff Portal</h2>
        <p>Lunera Crafts Management</p>

        <form id="staffLoginForm">
            <div class="form-group">
                <label>Staff Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Passcode</label>
                <input type="password" id="password" placeholder="Enter passcode" required>
            </div>
            <button type="button" class="login-btn" onclick="checkLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
            <div class="error-msg" id="errorMsg">Invalid Username or Password!</div>
        </form>
    </div>

    <!-- STAFF DASHBOARD (Shows upon successful login) -->
    <div class="dashboard" id="dashboardBox">
        <h3>Welcome, Staff! 👋</h3>
        <p>You have successfully logged in to Lunera Crafts Staff Portal.</p>
        <hr style="border-color: var(--glass-border); margin: 20px 0;">
        
        <p><strong>Quick Links:</strong></p>
        <ul>
            <li>Check WhatsApp Messages for customized orders</li>
            <li>Update Inventory / Photo Gallery</li>
        </ul>

        <button class="login-btn" style="margin-top: 20px;" onclick="logout()">Logout</button>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('errorMsg');

            // Default Login Credentials (You can change these)
            const correctUser = "staff";
            const correctPass = "lunera123";

            if (user === correctUser && pass === correctPass) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
            } else {
                error.style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('dashboardBox').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('errorMsg').style.display = 'none';
        }
    </script>

</body>
</html>
