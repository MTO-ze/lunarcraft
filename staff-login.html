<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal | Lunera Crafts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(20, 14, 10, 0.85);
            --glass-border: rgba(212, 175, 55, 0.3);
            --accent-gold: #d4af37;
            --accent-gold-bright: #ffd700;
            --text-dim: #b8a598;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0705;
            color: #f5ebe6;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 600px; width: 100%; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.2rem;
            color: var(--accent-gold-bright);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; color: var(--text-dim); font-size: 0.9rem; }

        input, textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37, #ffd700);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .btn-delete {
            background: #ff4d4d;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3><i class="fa-solid fa-user-shield"></i> Staff Portal</h3>
            <a href="index.html" style="color: var(--accent-gold); text-decoration: none;">Exit</a>
        </div>

        <!-- Add Product Form -->
        <div class="card">
            <h2 class="title"><i class="fa-solid fa-plus"></i> Add Product to Shop</h2>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prodTitle" placeholder="e.g. Customized Gift Box" required>
                </div>
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="prodPrice" placeholder="e.g. 499" required>
                </div>
                <div class="form-group">
                    <label>Image URL (only)</label>
                    <input type="text" id="prodImg" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-cloud-arrow-up"></i> Save & Add to Shop</button>
            </form>
        </div>

        <!-- Added Products List -->
        <div class="card">
            <h2 class="title"><i class="fa-solid fa-list"></i> Added Items in Shop</h2>
            <div id="staffProductList"></div>
        </div>
    </div>

    <script>
        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('prodTitle').value;
            const price = document.getElementById('prodPrice').value;
            const img = document.getElementById('prodImg').value;

            const newProduct = {
                id: Date.now(),
                title: title,
                price: price,
                img: img
            };

            let products = JSON.parse(localStorage.getItem('lunera_products')) || [];
            products.push(newProduct);
            localStorage.setItem('lunera_products', JSON.stringify(products));

            this.reset();
            loadStaffProducts();
            alert(' product successfully add!');
        });

        function loadStaffProducts() {
            const listDiv = document.getElementById('staffProductList');
            let products = JSON.parse(localStorage.getItem('lunera_products')) || [];

            if(products.length === 0) {
                listDiv.innerHTML = '<p style="color: var(--text-dim); font-size: 0.85rem;">No items added yet.</p>';
                return;
            }

            listDiv.innerHTML = '';
            products.forEach(p => {
                listDiv.innerHTML += `
                    <div class="product-item">
                        <div>
                            <strong>${p.title}</strong> - ₹${p.price}
                        </div>
                        <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
                    </div>
                `;
            });
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('lunera_products')) || [];
            products = products.filter(p => p.id !== id);
            localStorage.setItem('lunera_products', JSON.stringify(products));
            loadStaffProducts();
        }

        loadStaffProducts();
    </script>
</body>
</html>
