<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunarCraft - Business & Gaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            text-align: center;
        }
        header {
            background-color: #1e293b;
            padding: 25px 20px;
            border-bottom: 2px solid #38bdf8;
        }
        header h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .hero {
            padding: 50px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        .hero p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 14px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
        }
        .services {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: left;
        }
        .card h3 {
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .card p {
            color: #cbd5e1;
            font-size: 0.95rem;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            background-color: #020617;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>LunarCraft</h1>
    </header>

    <section class="hero">
        <h2>Welcome to LunarCraft</h2>
        <p>(test).</p>
        <a href="https://wa.me/910000000000" class="btn"> +91 95442 00349 </a>
    </section>

    <div class="services">
        <div class="card">

        <div class="card">

        </div>

    <footer>
