<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Your Gift | Lunera Crafts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0a0705;
            --accent-gold: #d4af37;
            --glass-bg: rgba(20, 14, 10, 0.85);
            --glass-border: rgba(212, 175, 55, 0.3);
            --text-light: #f5ebe6;
        }

        body { background: #070503; color: var(--text-light); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .custom-card { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(15px); padding: 40px; border-radius: 25px; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        h2 { color: var(--accent-gold); margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #ccc; }
        input, select, textarea { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; font-size: 1rem; }
        textarea { height: 100px; resize: none; }

        /* Golden Shimmer Button Style */
        .btn-customize {
            position: relative;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            border: none;
            border-radius: 50px;
            color: #000;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .btn-customize::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 0% { left: -100%; } 50% { left: 100%; } 100% { left: 100%; } }
        .btn-customize:hover { transform: scale(1.02); }
    </style>
</head>
<body>

<div class="custom-card">
    <h2>Customize Your Gift</h2>
    <form id="customizeForm">
        <div class="form-group">
            <label>Recipient Name</label>
            <input type="text" id="recipientName" placeholder="Whom is this for?" required>
        </div>
        <div class="form-group">
            <label>Occasion</label>
            <select id="occasion">
                <option>Birthday</option>
                <option>Anniversary</option>
                <option>Wedding</option>
                <option>Valentine's Day</option>
                <option>Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Budget Range</label>
            <select id="budget">
                <option>Under ₹500</option>
                <option>₹500 - ₹1500</option>
                <option>₹1500+</option>
            </select>
        </div>
        <div class="form-group">
            <label>Custom Message</label>
            <textarea id="message" placeholder="What should be written on the card?"></textarea>
        </div>
        <button type="button" class="btn-customize" onclick="sendToWhatsApp()">
            <i class="fa-brands fa-whatsapp"></i> Send Request
        </button>
    </form>
</div>

<script>
    function sendToWhatsApp() {
        const name = document.getElementById('recipientName').value;
        const occasion = document.getElementById('occasion').value;
        const budget = document.getElementById('budget').value;
        const message = document.getElementById('message').value;

        if(!name) { alert("Please enter a name"); return; }

        const waText = `Hi Lunera Crafts! I'd like to customize a gift.
        
        *Recipient:* ${name}
        *Occasion:* ${occasion}
        *Budget:* ${budget}
        *Message:* ${message}`;

        const url = `https://wa.me/919544200349?text=${encodeURIComponent(waText)}`;
        window.open(url, '_blank');
    }
</script>
</body>
</html>
