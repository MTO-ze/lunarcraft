<style>
    /* 1. Page Fade-in Animation */
    body { 
        background-color: #120d0a; 
        color: #f5ebe6; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        text-align: center; 
        padding: 20px; 
        animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 { color: #d4af37; margin-top: 20px; }
    .product-grid { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; margin-top: 30px; }

    /* 2. Product Card Lift & Glow Animation */
    .product-card { 
        background: #1a130f; 
        border: 1px solid #333; 
        padding: 15px; 
        border-radius: 16px; 
        width: 260px; 
        text-align: center; 
        transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
        overflow: hidden;
    }

    .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 25px rgba(212, 175, 55, 0.25);
        border-color: #d4af37;
    }

    /* 3. Image Zoom Animation */
    .product-card img { 
        width: 100%; 
        height: 200px; 
        object-fit: cover; 
        border-radius: 10px; 
        transition: transform 0.5s ease;
    }

    .product-card:hover img {
        transform: scale(1.08);
    }

    .product-title { color: #fff; margin: 14px 0 5px; font-size: 1.1em; }
    .price { color: #d4af37; font-weight: bold; font-size: 1.2em; margin-bottom: 14px; }

    /* 4. Button Glow & Hover Effect */
    .order-btn { 
        background: #25D366; 
        color: white; 
        padding: 10px 18px; 
        text-decoration: none; 
        border-radius: 20px; 
        display: inline-block; 
        font-weight: bold; 
        font-size: 0.9em; 
        transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .order-btn:hover {
        background: #20ba5a;
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
    }

    .back-btn { 
        display: inline-block; 
        margin: 35px 0; 
        color: #d4af37; 
        text-decoration: none; 
        border: 1px solid #d4af37; 
        padding: 10px 20px; 
        border-radius: 25px; 
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .back-btn:hover {
        background: #d4af37;
        color: #120d0a;
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }
</style>
