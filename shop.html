<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Lunera Crafts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #120d0a; color: #f5ebe6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; }
        h1 { color: #d4af37; margin-top: 20px; }
        .product-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 30px; }
        .product-card { background: #1a130f; border: 1px solid #333; padding: 15px; border-radius: 12px; width: 260px; text-align: center; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .product-title { color: #fff; margin: 12px 0 5px; font-size: 1.1em; }
        .price { color: #d4af37; font-weight: bold; font-size: 1.2em; margin-bottom: 12px; }
        .order-btn { background: #25D366; color: white; padding: 10px 18px; text-decoration: none; border-radius: 20px; display: inline-block; font-weight: bold; font-size: 0.9em; }
        .back-btn { display: inline-block; margin: 30px 0; color: #d4af37; text-decoration: none; border: 1px solid #d4af37; padding: 8px 16px; border-radius: 20px; }
    </style>
</head>
<body>

    <h1>Our Products</h1>
    <p>Select your favorite items and order directly via WhatsApp</p>

    <div class="product-grid">

        <!-- protect  1 -->
        <div class="product-card">
            <img src="1786177485136.png" alt="Customized Gift Box">
            <h3 class="product-title">Customized Gift Box</h3>
            <p class="price">₹499</p>
            <a href="https://wa.me/919544200349?text=Hello,%20I%20want%20to%20order%20Customized%20Gift%20Box" class="order-btn">
               <i class="fa-brands fa-whatsapp"></i> Order on WhatsApp
            </a>
        </div>

        <!-- more product  -->

    </div>

    <a href="index.html" class="back-btn">← Back to Home</a>

</html>
